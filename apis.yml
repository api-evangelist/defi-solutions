name: defi SOLUTIONS
description: 'defi SOLUTIONS is an auto and consumer lending technology company founded in 2012 and
  headquartered in Westlake, Texas. It provides cloud-native, API-enabled loan origination software
  (defi ORIGINATIONS), a servicing platform for account, collateral, and default management, digital
  borrower acquisition and self-service portals, and outsourced (BPO) managed servicing. The platform
  serves captive auto finance companies, banks, credit unions, and consumer finance companies, and
  ships 135+ pre-built partner integrations (Dealertrack, RouteOne, TransUnion, Equifax, LexisNexis,
  Experian, Black Book, J.D. Power, Zest AI, and more). APIs move borrower and loan data between
  origination and servicing but are exposed to enterprise customers and integration partners rather
  than through a public developer portal.'
